spring:
  application:
    name: SecondLibProject
  profiles:
    active: prod
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  web:
    locale: en_US
    locale-resolver: fixed

# Origins allowed to call the REST API with credentials (Vite dev server by default).
app:
  cors:
    allowed-origins: http://localhost:5173

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    root: info
    by.tms: debug
